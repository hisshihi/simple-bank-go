version: '3'

vars:
  BIN: ./bin/app
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOOSE: '{{.BIN_DIR}}/goose'
  PB_DIR: internal/api/pb

tasks:
  default:
    desc: Run all checks and build
    cmds:
      - task: gen
      - task: fmt
      - task: lint
      - task: test
      - task: test:mini
      - task: build
      - task: migrate:up
      - task: migrate:down
      - task: goose:status
      - task: golangci:lint
      - task: golangci:fix
      - task: golangci:lint:last
      - task: golangci:fix:last
      - task: proto
      - task: proto:lint
      - task: proto:breaking

  golangci:lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  golangci:fix:
    desc: Run fix linter
    cmds:
      - golangci-lint run --fix

  golangci:lint:last:
    desc: Запуск линтера относительно последнего комита
    cmds:
      - golangci-lint run --new-from-rev=HEAD~1

  golangci:fix:last:
    desc: Запуск фикса линтера относительно последнего комита
    cmds:
      - golangci-lint run --fix --new-from-rev=HEAD~1

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/app

  migrate:up:
    desc: "Накатывает все миграции"
    dotenv: [ '.env' ]
    cmds:
      - 'goose up'

  migrate:down:
    desc: 'Откатывание миграции'
    dotenv: [ '.env' ]
    cmds:
      - 'goose down'

  goose:status:
    desc: 'Вывести статус миграций'
    dotenv: [ '.env' ]
    cmds:
      - 'goose status'

  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BIN}} .

  test:
    desc: Run tests with race detector
    cmds:
      - go test -race -v -cover -count=100 ./...

  test:mini:
    desc: Run tests with race detector
    cmds:
      - go test -race -v -cover -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code and tidy mod
    cmds:
      - go fmt ./...
      - go mod tidy

  gen:
    desc: Run go generate
    cmds:
      - go generate ./...

  proto:
    desc: Generate protobuf and gRPC code
    sources:
      - internal/api/proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - "{{.PB_DIR}}/**/*.go"
    cmds:
      - rm -rf {{.PB_DIR}}
      - mkdir -p {{.PB_DIR}}
      - buf generate

  proto:lint:
    desc: Lint proto files
    cmds:
      - buf lint

  proto:breaking:
    desc: Check for breaking changes against main
    cmds:
      - buf breaking --against '.git#branch=main'

  evans:
    desc: Start Evans REPL
    cmds:
      - evans --port 9092 --host localhost --path proto --proto verify.proto repl

  clean:
    desc: Clean binaries and coverage
    cmds:
      - rm -rf bin/
      - rm -f coverage.out coverage.html
      - go clean