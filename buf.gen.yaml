version: v2
plugins:
  - local: protoc-gen-go
    out: internal/api/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/api/pb
    opt: paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/hisshihi/simple-bank/internal/api/pb